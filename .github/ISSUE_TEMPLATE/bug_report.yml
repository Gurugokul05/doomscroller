name: Bug report
description: Something in doomscroller is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please redact usernames, paths, tokens, and
        anything else you do not want public.
  - type: input
    id: version
    attributes:
      label: doomscroller version
      description: Output of `doomscroller --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.20.0
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - hotkey
        - hook (Claude Code)
        - cli-wrapper
        - ide-activity
        - not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Paste `doomscroller config --json` (redact paths if needed).
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Tail of `%USERPROFILE%\.doomscroller\doomscroller.log`.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I am running the latest release.
          required: true
        - label: I have removed secrets from the config and logs above.
          required: true
